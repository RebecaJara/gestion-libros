<h1>Gestor de Libros</h1>

<h2>Mis libros</h2>

<p>Total de libros: {{ libros.length }}</p>

<table>
  <thead>
    <tr>
      <th>Título</th>
      <th>Autor</th>
      <th>Género</th>
      <th>Año</th>
      <th>Estado</th>
      <th>Calificación</th>
    </tr>
  </thead>

  <tbody>
    @for (libro of libros; track libro.id) {
      <tr>
        <td>{{ libro.titulo }}</td>
        <td>{{ libro.autor }}</td>
        <td>{{ libro.genero }}</td>
        <td>{{ libro.anio }}</td>
        <td>{{ libro.estado }}</td>
        <td>{{ libro.calificacion }}</td>
      </tr>
    }
  </tbody>
</table>
